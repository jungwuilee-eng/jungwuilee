name: Remove duplicate footer contacts

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicated footer contact links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          text = re.sub(r'\n\s*<div class="footer-phone">.*?</div>', '', text, count=1, flags=re.S)
          text = re.sub(r'\n\s*<div class="footer-socials">.*?</div>', '', text, count=1, flags=re.S)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit homepage update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove duplicate footer contact links"
          git push
